name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write .env.local
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env.local
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.local

      - name: Expo prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS archive (unsigned)
        run: |
          xcodebuild \
            -workspace ios/HealthMaxx.xcworkspace \
            -scheme HealthMaxx \
            -configuration Release \
            -archivePath $RUNNER_TEMP/HealthMaxx.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$RUNNER_TEMP/HealthMaxx.xcarchive/Products/Applications/HealthMaxx.app" $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r HealthMaxx.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HealthMaxx-IPA
          path: ${{ runner.temp }}/HealthMaxx.ipa
          retention-days: 7
